services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mume
      MYSQL_USER: mume
      MYSQL_PASSWORD: mume
      MYSQL_ROOT_PASSWORD: root
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  node-yt:
    build: ../node-yt
    environment:
      INTERNAL_KEY: ${NODE_YT_KEY}

  server:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      DB_DSN: root@tcp(mysql:3306)/mume?parseTime=true&multiStatements=true&charset=utf8mb4
      NODE_YT_URL: http://node-yt:3000
    volumes: [data:/data]
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  mysql:
  data:
